<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#008069">
<title>Logbook · Write v2</title>
<style>
:root {
  --bg: #efeae2; --panel: #f0f2f5; --bar: #008069; --bar-fg: #ffffff;
  --bubble: #d9fdd3; --fg: #111b21; --muted: #667781; --pill: #ffffff;
  --accent: #00a884; --tag: #027eb5; --error: #b3261e; --shadow: 0 1px .5px rgba(11,20,26,.13);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b141a; --panel: #202c33; --bar: #202c33; --bar-fg: #e9edef;
    --bubble: #005c4b; --fg: #e9edef; --muted: #8696a0; --pill: #2a3942;
    --tag: #53bdeb; --error: #f2b8b5; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 980px; margin: 0 auto; }

/* ---------- En-tête ---------- */
header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); background: var(--bar); color: var(--bar-fg); }
.back { color: inherit; text-decoration: none; font-size: 28px; line-height: 1; padding: 0 2px 2px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 600; flex: 0 0 auto; }
.who { flex: 1; min-width: 0; }
.who b { display: block; font-size: 16px; font-weight: 600; }
.who small { display: block; font-size: 12.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .hbtn { all: unset; cursor: pointer; font-size: 13px; opacity: .85; padding: 6px; }
header .hbtn:hover { opacity: 1; text-decoration: underline; }

/* ---------- Conversation ---------- */
main { flex: 1; overflow-y: auto; padding: 8px 6% 10px; display: flex; flex-direction: column; overscroll-behavior: contain; }
#items { margin-top: auto; display: flex; flex-direction: column; gap: 3px; }
.sys { align-self: center; max-width: 90%; text-align: center; background: var(--pill); color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: var(--shadow); margin: 10px 0 6px; }
.sys a { color: var(--tag); }
.sys.error { color: var(--error); }
.bubble { align-self: flex-end; position: relative; max-width: min(85%, 580px); min-width: 90px; background: var(--bubble); border-radius: 8px; padding: 6px 9px 5px; box-shadow: var(--shadow); cursor: pointer; overflow-wrap: anywhere; }
.bubble.first { border-top-right-radius: 0; margin-top: 4px; }
.bubble.first::after { content: ""; position: absolute; top: 0; right: -8px; border-top: 10px solid var(--bubble); border-right: 8px solid transparent; }
.bubble.current { opacity: .5; }
.tags { font-size: 12.5px; color: var(--tag); margin-bottom: 2px; font-weight: 500; }
.text { white-space: pre-wrap; }
.text img { display: block; max-width: 100%; height: auto; border-radius: 6px; margin: 4px 0; }
.text pre { margin: 4px 0; white-space: pre; overflow-x: auto; line-height: 1.2; }
.text a { color: var(--tag); }
.tick { float: right; font-size: 11px; color: var(--muted); margin: 7px 0 -3px 12px; user-select: none; }
.tick b { color: var(--tag); font-weight: 400; letter-spacing: -3px; margin-left: 3px; }
.menu { clear: both; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; border-top: 1px solid rgba(127,127,127,.25); margin-top: 6px; padding-top: 5px; font-size: 13.5px; }
.menu button { all: unset; cursor: pointer; color: var(--tag); padding: 2px 0; }
.menu button.danger { color: var(--error); }

/* ---------- Écran privé / clé ---------- */
.gate { margin: auto; display: grid; gap: 10px; width: min(360px, 100%); }
.gate input { font: inherit; font-size: 16px; color: var(--fg); background: var(--pill); border: 0; border-radius: 22px; padding: 10px 16px; width: 100%; }
.gate .send { justify-self: center; width: auto; height: auto; border-radius: 22px; padding: 9px 22px; }

/* ---------- Zone d'écriture ---------- */
footer { flex: 0 0 auto; background: var(--panel); padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: grid; gap: 6px; }
#status { justify-self: center; font-size: 12.5px; color: var(--muted); background: var(--pill); border-radius: 8px; padding: 4px 12px; text-align: center; }
#status:empty { display: none; }
#status.error { color: var(--error); }
.strip { display: flex; align-items: center; gap: 10px; background: var(--pill); border-left: 4px solid var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.strip span { flex: 1; min-width: 0; }
.strip button { all: unset; cursor: pointer; color: var(--tag); }
.strip .x { color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
.ctx { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { position: relative; display: inline-flex; align-items: center; gap: 4px; background: var(--pill); border: 0; border-radius: 14px; padding: 3px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
.pill.tag { color: var(--tag); }
.pill .x { opacity: .6; }
.pill input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 0; }
.thumb { position: relative; flex: 0 0 auto; }
.thumb img { display: block; width: 58px; height: 58px; object-fit: cover; border-radius: 8px; }
.thumb button { all: unset; cursor: pointer; position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); color: var(--panel); font-size: 13px; line-height: 20px; text-align: center; }
.bar { display: flex; align-items: flex-end; gap: 6px; }
.field { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--pill); border-radius: 22px; padding: 2px 4px; }
.field textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; resize: none; font: inherit; color: var(--fg); padding: 9px 6px; height: 40px; max-height: 40vh; line-height: 1.4; }
.icon { all: unset; cursor: pointer; flex: 0 0 auto; width: 36px; height: 38px; display: grid; place-items: center; color: var(--muted); font-size: 20px; }
.icon.on { color: var(--accent); }
.icon svg, .send svg { width: 22px; height: 22px; fill: currentColor; }
.send { all: unset; cursor: pointer; flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.send:disabled { opacity: .5; cursor: default; }
.icon:focus-visible, .send:focus-visible, .pill:focus-within, .menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Panneau des sujets (s'ouvre avec #) */
#panel { background: var(--pill); border-radius: 12px; padding: 10px 12px; max-height: 45vh; overflow-y: auto; display: grid; gap: 10px; font-size: 13px; }
#panel label { display: grid; gap: 4px; color: var(--muted); }
#panel input[type=text], #panel select { font: inherit; color: var(--fg); background: var(--panel); border: 0; border-radius: 8px; padding: 7px 10px; width: 100%; }
#panel select { width: auto; padding: 4px 8px; }
.new-topics { display: grid; gap: 6px; }
.new-topics .nt { display: flex !important; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--fg) !important; }
.chips details { border-top: 1px solid rgba(127,127,127,.2); padding: 6px 0; }
.chips summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; color: var(--fg); font-weight: 500; }
.chips summary::-webkit-details-marker { display: none; }
.chips summary::before { content: "▸"; width: 1.1em; color: var(--muted); }
.chips details[open] summary::before { content: "▾"; }
.chips summary span:first-of-type { flex: 1; }
.chips summary .n { color: var(--muted); font-weight: 400; }
.chips .list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 2px; }
.chips .list button { all: unset; cursor: pointer; background: var(--panel); border-radius: 14px; padding: 3px 10px; color: var(--tag); overflow-wrap: anywhere; }
.chips .list button.sel { background: var(--accent); color: #fff; }
.hint { color: var(--muted); margin: 0; }
.hint code { font-size: 12px; }
.panel-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-foot button { all: unset; cursor: pointer; color: var(--tag); }

@media (max-width: 680px) {
  main { padding: 6px 10px 10px; }
  .bubble { max-width: 88%; }
  .field textarea, #panel input[type=text], #panel select, .gate input { font-size: 16px; }
  .chips .list button { padding: 5px 12px; }
  .menu { gap: 4px 24px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="./" aria-label="View the site">‹</a>
    <div class="avatar" aria-hidden="true">L</div>
    <div class="who"><b>Logbook</b><small id="sub">Private · only you can write</small></div>
    <button type="button" class="hbtn" id="logout" hidden>Log out</button>
  </header>

  <main id="main">
    <!-- Sans clé : simple message. Champ de la clé seulement sur write-v2.html#connect -->
    <p class="sys" id="private" hidden>This page is private. <a href="./">Read the logbook</a>.</p>
    <section class="gate" id="setup" hidden>
      <input type="password" id="token" autocomplete="off" spellcheck="false" placeholder="Access key  github_pat_…" aria-label="Access key">
      <button type="button" class="send" id="save-token">Connect</button>
      <p class="sys error" id="setup-error" hidden></p>
    </section>
    <div id="items" hidden></div>
  </main>

  <footer id="editor" hidden>
    <div id="status" role="status"></div>

    <div class="strip" id="editing" hidden><span id="editing-label"></span><button type="button" class="x" id="cancel-edit" aria-label="Cancel editing">×</button></div>
    <div class="strip" id="confirm-save" hidden>
      <span>Are you sure you want to save the changes to this note?</span>
      <button type="button" id="confirm-yes">Yes, save</button>
      <button type="button" id="confirm-no">Cancel</button>
    </div>

    <!-- Sujets, s'ouvre avec le bouton # -->
    <div id="panel" hidden>
      <label>Topics<input type="text" id="topics" placeholder="theory, Wendy-Chun" autocomplete="off"></label>
      <div class="new-topics" id="new-topics" hidden></div>
      <div class="chips" id="known-topics" aria-label="Existing topics"></div>
      <p class="hint">Links <code>[title](https://…)</code> · italic <code>*text*</code> · bold <code>**text**</code> · heading <code>### text</code> · HTML works too</p>
      <div class="panel-foot"><button type="button" id="clear">Clear the note</button><button type="button" id="panel-close">Done</button></div>
    </div>

    <div class="ctx" id="ctx">
      <label class="pill" title="Date of the note"><span id="date-label">Today</span> ▾<input type="date" id="date" aria-label="Date"></label>
      <span id="tag-pills" class="ctx"></span>
    </div>
    <div class="thumbs" id="files" hidden></div>

    <div class="bar">
      <div class="field">
        <button type="button" class="icon" id="topics-btn" aria-label="Topics" title="Topics">#</button>
        <textarea id="text" rows="1" placeholder="Note"></textarea>
        <label class="icon" title="Add images" aria-label="Add images">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg>
          <input type="file" id="images" accept="image/*" multiple hidden>
        </label>
      </div>
      <button type="button" class="send" id="publish" aria-label="Publish" title="Publish">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="send-icon"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const OWNER = "sarahbg30", REPO = "md1-notes-site", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const KEY_TOKEN = "logbook-token", KEY_DRAFT = "logbook-draft-v2";
const $ = id => document.getElementById(id);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const dayLabel = ymd => new Date(ymd + "T12:00:00").toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
const shortDay = ymd => {
  if (ymd === today()) return "Today";
  const y = new Date(Date.now() - 864e5); if (ymd === new Date(y - y.getTimezoneOffset()*60000).toISOString().slice(0,10)) return "Yesterday";
  return new Date(ymd + "T12:00:00").toLocaleDateString("en-GB", { day:"numeric", month:"long", year: ymd.slice(0,4) === today().slice(0,4) ? undefined : "numeric" });
};

function setStatus(msg, isError) { $("status").textContent = msg; $("status").classList.toggle("error", !!isError); }

/* ---------- GitHub ---------- */
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    cache: "no-store",
    headers: { "Authorization": "Bearer " + store.get(KEY_TOKEN), "Accept": "application/vnd.github+json", ...(opts.body ? { "Content-Type": "application/json" } : {}) }
  });
  if (!res.ok) {
    const err = new Error("GitHub " + res.status); err.status = res.status;
    try { err.detail = (await res.json()).message; } catch {}
    throw err;
  }
  return res.status === 204 ? null : res.json();
}
function explain(e) {
  if (e.code === "missing") return "This note was changed elsewhere in the meantime. The list is now up to date: open it again with Edit.";
  if (e.status === 401) return "The access key is invalid or has expired. Log out and paste a new one.";
  if (e.status === 403 || e.status === 404) return "The access key can't write to md1-notes-site. Check it has “Contents: Read and write” on this repository.";
  if (e.status === 409 || e.status === 422) return "The notes changed on GitHub at the same time. Try again.";
  if (!navigator.onLine) return "You are offline. Your text is kept here; try again when you're back online.";
  return "It didn't work (" + (e.detail || e.message) + "). Your text is kept here; try again.";
}

// UTF-8 <-> base64
const b64decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });

/* ---------- notes.md : découpage en notes ----------
   Le cadre <!-- … --> du haut contient un exemple « ## date » : on l'ignore. */
function splitNotes(src) {
  const comments = [...src.matchAll(/<!--[\s\S]*?-->/g)].map(m => [m.index, m.index + m[0].length]);
  const inComment = i => comments.some(([a, b]) => i >= a && i < b);
  const starts = [...src.matchAll(/^#{2,}[ \t]*(?=\d{4}-\d{2}-\d{2})/gm)].map(m => m.index).filter(i => !inComment(i));
  const preamble = src.slice(0, starts[0] ?? src.length);
  const blocks = starts.map((s, i) => src.slice(s, starts[i + 1] ?? src.length));
  return { preamble, blocks };
}
function joinNotes({ preamble, blocks }) {
  const parts = blocks.map(b => b.replace(/\s+$/, "")).filter(Boolean);
  const head = preamble.replace(/\s+$/, "");
  return (head ? head + "\n\n" : "") + parts.join("\n\n") + "\n";
}
function readBlock(raw) {
  const lines = raw.replace(/<!--[\s\S]*?-->/g, "").replace(/[﻿​]/g, "").split("\n");
  const date = (lines.shift().match(/\d{4}-\d{2}-\d{2}/) || [])[0];
  let tags = [];
  while (lines.length && !lines[0].trim()) lines.shift();
  if (lines.length && /^\s*#[^\s#]/.test(lines[0])) tags = lines.shift().split(/[\s,#]+/).filter(Boolean);
  return { date, tags, text: lines.join("\n").trim() };
}
function makeBlock(date, topics, text) {
  return `## ${date}\n` + (topics.length ? topics.map(t => "#" + t).join(" ") + "\n" : "") + "\n" + text + "\n";
}

/* Mise en forme comme sur le site : markdown simple + HTML gardé tel quel */
function inline(text) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const md = s => esc(s)
    .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+|[\w-][\w.\/%-]*)\)/g, '<img src="$2" alt="$1" loading="lazy">')
    .replace(/^#{1,6}[ \t]+(.+)$/gm, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(\s*\)/g, "$1")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  text = text.replace(/\n{3,}/g, "\n\n");
  const blockRe = /<(style|pre)\b[^>]*>[\s\S]*?(?:<\/\1\s*>|$)/gi;
  const tagRe = /<\/?[a-zA-Z][\w-]*(?:\s+[^<>]*)?\/?>/g;
  let out = "", last = 0;
  const plain = s => { let o = "", l = 0; s.replace(tagRe, (t, i) => { o += md(s.slice(l, i)) + t; l = i + t.length; }); return o + md(s.slice(l)); };
  text.replace(blockRe, (b, _n, i) => { out += plain(text.slice(last, i)) + b; last = i + b.length; });
  out += plain(text.slice(last));
  return out.replace(/\n*(<\/?(?:style|pre|div|p|ul|ol|li|h[1-6]|table|tr|td|th|hr|br)\b[^>]*>)\n?/gi, "$1");
}

/* ---------- Un seul commit : images + notes.md ---------- */
async function commit(transform, images, message, newTopics = []) {
  const ref = await gh(`/git/ref/heads/${BRANCH}`);
  const head = await gh(`/git/commits/${ref.object.sha}`);
  const file = await gh(`/contents/notes.md?ref=${ref.object.sha}`);
  const current = b64decode(file.content);
  let updated;
  try { updated = transform(current); }
  catch (e) { source = current; renderList(); throw e; }

  const tree = [];
  for (const img of images) {
    setStatus("Uploading " + img.name + "…");
    const blob = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: await blobToB64(img.blob), encoding: "base64" }) });
    tree.push({ path: img.path, mode: "100644", type: "blob", sha: blob.sha });
  }
  tree.push({ path: "notes.md", mode: "100644", type: "blob", content: updated });
  let cats = null;
  if (newTopics.length) {
    try { cats = b64decode((await gh(`/contents/categories.md?ref=${ref.object.sha}`)).content); }
    catch (e) { if (e.status !== 404) throw e; cats = ""; }
    newTopics.forEach(({ tag, cat }) => { cats = addToCats(cats, cat, tag); });
    tree.push({ path: "categories.md", mode: "100644", type: "blob", content: cats });
  }
  const newTree = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
  const c = await gh("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: newTree.sha, parents: [ref.object.sha] }) });
  await gh(`/git/refs/heads/${BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
  source = updated; if (cats !== null) catSource = cats;
  renderList(); renderTopics();
}

/* ---------- Clé d'accès ---------- */
$("save-token").onclick = async () => {
  const t = $("token").value.trim();
  if (!t) return;
  store.set(KEY_TOKEN, t);
  $("save-token").disabled = true; $("setup-error").hidden = true;
  try {
    await gh("");                 // vérifie que la clé voit le dépôt
    $("token").value = "";
    show();
  } catch (e) {
    store.del(KEY_TOKEN);
    $("setup-error").hidden = false;
    $("setup-error").textContent = e.status === 401 ? "This key is not valid. Copy it again from GitHub." : "This key can't see md1-notes-site. Check “Only select repositories” → md1-notes-site.";
  }
  $("save-token").disabled = false;
};
$("token").addEventListener("keydown", e => { if (e.key === "Enter") $("save-token").click(); });
$("logout").onclick = () => { store.del(KEY_TOKEN); show(); };

function show() {
  const has = !!store.get(KEY_TOKEN);
  const connect = location.hash === "#connect";
  $("setup").hidden = has || !connect; $("private").hidden = has || connect;
  $("editor").hidden = !has; $("items").hidden = !has; $("logout").hidden = !has;
  if (has) { $("items").replaceChildren(sys("Loading…")); loadSource(); }
}

/* ---------- Notes publiées = la conversation (lue sur GitHub, toujours à jour) ---------- */
let source = "", catSource = "", firstLoad = true;
async function loadSource() {
  try {
    const file = await gh(`/contents/notes.md?ref=${BRANCH}`);
    source = b64decode(file.content);
    try { catSource = b64decode((await gh(`/contents/categories.md?ref=${BRANCH}`)).content); }
    catch (e) { if (e.status !== 404) throw e; catSource = ""; }
  } catch (e) {
    const p = sys(explain(e)); p.classList.add("error"); $("items").replaceChildren(p);
    return;
  }
  renderList(); renderTopics();
}
function sys(text) { const p = document.createElement("p"); p.className = "sys"; p.textContent = text; return p; }
const scrollDown = () => { const m = $("main"); m.scrollTop = m.scrollHeight; };
// À l'ouverture : rester en bas pendant que les images se chargent (sauf si vous remontez)
let stick = true;
["wheel", "touchmove"].forEach(ev => $("main").addEventListener(ev, () => { stick = false; }, { passive: true }));

const localImages = new Map();   // images que vous venez d'ajouter : visibles tout de suite
let openMenu = null, confirmDelete = null;   // texte brut de la note concernée
function renderList() {
  const box = $("items"); box.replaceChildren();
  const notes = splitNotes(source).blocks.map((raw, order) => ({ raw, order, ...readBlock(raw) })).filter(n => n.date);
  notes.sort((a, b) => a.date.localeCompare(b.date) || a.order - b.order);   // la plus récente en bas
  $("sub").textContent = notes.length + " note" + (notes.length === 1 ? "" : "s") + " · only you can write";
  if (!notes.length) { box.appendChild(sys("No notes yet. Write the first one below.")); return; }
  let lastDay = null;
  notes.forEach(n => {
    const first = n.date !== lastDay;
    if (first) { const s = sys(n.date === today() ? "Today" : dayLabel(n.date)); s.classList.add("sep"); box.appendChild(s); lastDay = n.date; }
    const b = document.createElement("div"); b.className = "bubble" + (first ? " first" : "");
    if (editing && editing.raw === n.raw) b.classList.add("current");
    if (n.tags.length) { const t = document.createElement("div"); t.className = "tags"; t.textContent = n.tags.map(x => "#" + x).join(" "); b.appendChild(t); }
    const tick = document.createElement("span"); tick.className = "tick"; tick.innerHTML = "<b>✓✓</b>";
    const tx = document.createElement("div"); tx.className = "text"; tx.innerHTML = inline(n.text);
    tx.querySelectorAll("img").forEach(i => { const l = localImages.get(i.getAttribute("src")); if (l) i.src = l; i.loading = "eager"; i.addEventListener("load", () => { if (stick) scrollDown(); }); });
    tx.appendChild(tick);
    b.appendChild(tx);

    if (confirmDelete === n.raw) {
      b.appendChild(menu([["Are you sure you want to delete this note?"], ["Yes, delete", () => removeNote(n), "danger"], ["Cancel", () => { confirmDelete = null; renderList(); }]]));
    } else if (openMenu === n.raw) {
      b.appendChild(menu([["Edit", () => startEdit(n)], ["Delete", () => { confirmDelete = n.raw; renderList(); }, "danger"]]));
    }
    // Toucher une note : afficher Edit / Delete
    b.onclick = e => {
      if (e.target.closest("a, button, .menu")) return;
      if (getSelection().toString()) return;
      openMenu = openMenu === n.raw ? null : n.raw; confirmDelete = null; renderList();
    };
    box.appendChild(b);
  });
  if (firstLoad) { firstLoad = false; requestAnimationFrame(scrollDown); setTimeout(scrollDown, 400); }
}
function menu(items) {
  const m = document.createElement("div"); m.className = "menu";
  items.forEach(([label, fn, cls]) => {
    if (!fn) { const s = document.createElement("span"); s.textContent = label; m.appendChild(s); return; }
    const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls;
    b.onclick = fn; m.appendChild(b);
  });
  return m;
}

/* ---------- Catégories (categories.md) : « ## Nom » puis les sujets avec # ---------- */
const CATEGORY_NAMES = ["People", "Techniques", "Themes", "Media", "Other"];
function parseCats(src) {
  return src.replace(/<!--[\s\S]*?-->/g, "").split(/^##[ \t]+/m).slice(1).map(b => {
    const lines = b.split("\n");
    return { name: lines.shift().trim(), tags: lines.join(" ").split(/[\s,#]+/).filter(Boolean).map(t => t.toLowerCase()) };
  }).filter(c => c.name);
}
const catNames = () => { const n = parseCats(catSource).map(c => c.name); CATEGORY_NAMES.forEach(x => { if (!n.some(y => y.toLowerCase() === x.toLowerCase())) n.push(x); }); return n; };
const catOf = t => (parseCats(catSource).find(c => c.tags.includes(t.toLowerCase())) || {}).name || null;
function addToCats(src, name, tag) {
  const lines = src.replace(/\s+$/, "").split("\n");
  const isHead = l => /^##[ \t]+/.test(l);
  const idx = lines.findIndex(l => isHead(l) && l.replace(/^##[ \t]+/, "").trim().toLowerCase() === name.toLowerCase());
  if (idx < 0) return (lines.join("\n") ? lines.join("\n") + "\n\n" : "") + `## ${name}\n#${tag}\n`;
  let end = idx + 1; while (end < lines.length && !isHead(lines[end])) end++;
  let last = end - 1; while (last > idx && !lines[last].trim()) last--;
  if (last === idx) lines.splice(idx + 1, 0, "#" + tag); else lines[last] = lines[last].replace(/\s+$/, "") + " #" + tag;
  return lines.join("\n") + "\n";
}

/* ---------- Sujets : catégories dépliables, un toucher ajoute ou retire ---------- */
let knownTopics = [];
const openCats = new Set();
function renderTopics() {
  const seen = {};
  splitNotes(source).blocks.forEach(raw => readBlock(raw).tags.forEach(t => seen[t.toLowerCase()] ??= t));
  knownTopics = Object.values(seen).sort((a, b) => a.localeCompare(b, "en", { sensitivity: "base" }));
  const chosen = new Set(parseTopics($("topics").value).map(t => t.toLowerCase()));
  const box = $("known-topics"); box.replaceChildren();
  catNames().forEach(name => {
    const items = knownTopics.filter(t => (catOf(t) || "Other").toLowerCase() === name.toLowerCase());
    if (!items.length) return;
    const d = document.createElement("details");
    d.open = openCats.has(name);
    d.ontoggle = () => { d.open ? openCats.add(name) : openCats.delete(name); };
    const s = document.createElement("summary");
    const nm = document.createElement("span"); nm.textContent = name;
    const c = document.createElement("span"); c.className = "n"; c.textContent = items.length;
    s.append(nm, c);
    const list = document.createElement("div"); list.className = "list";
    items.forEach(t => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = "#" + t;
      if (chosen.has(t.toLowerCase())) b.className = "sel";
      b.onclick = () => toggleTopic(t);
      list.appendChild(b);
    });
    d.append(s, list); box.appendChild(d);
  });
  renderNewTopics(); renderPills();
}
function toggleTopic(t) {
  const cur = parseTopics($("topics").value);
  const has = cur.some(x => x.toLowerCase() === t.toLowerCase());
  $("topics").value = (has ? cur.filter(x => x.toLowerCase() !== t.toLowerCase()) : [...cur, t]).join(", ");
  saveDraft(); renderTopics();
}
// Sujets choisis, affichés au-dessus du champ
function renderPills() {
  const box = $("tag-pills"); box.replaceChildren();
  const list = canonical($("topics").value);
  list.forEach(t => {
    const b = document.createElement("button"); b.type = "button"; b.className = "pill tag";
    b.innerHTML = ""; b.append("#" + t + " "); const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; b.appendChild(x);
    b.setAttribute("aria-label", "Remove topic " + t);
    b.onclick = () => toggleTopic(t);
    box.appendChild(b);
  });
  const add = document.createElement("button"); add.type = "button"; add.className = "pill";
  add.textContent = list.length ? "+ topic" : "# Add topics";
  add.onclick = () => setPanel(true);
  box.appendChild(add);
  $("topics-btn").classList.toggle("on", list.length > 0);
}

/* Nouveaux sujets : choisir leur catégorie avant de publier */
let newCats = {};   // minuscules -> catégorie choisie
function newTopicList() {
  return canonical($("topics").value).filter(t => !catOf(t));
}
function renderNewTopics() {
  const list = newTopicList(), box = $("new-topics");
  box.replaceChildren(); box.hidden = !list.length;
  list.forEach(t => {
    const row = document.createElement("label"); row.className = "nt";
    const name = document.createElement("span"); name.textContent = "New topic #" + t + " → category";
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Category for #" + t);
    catNames().forEach(c => { const o = document.createElement("option"); o.value = o.textContent = c; sel.appendChild(o); });
    sel.value = newCats[t.toLowerCase()] || "Other";
    sel.onchange = () => { newCats[t.toLowerCase()] = sel.value; };
    row.append(name, sel); box.appendChild(row);
  });
}
$("topics").addEventListener("input", () => { renderNewTopics(); renderPills(); });
$("topics").addEventListener("change", renderTopics);
const parseTopics = s => s.split(/[\s,#]+/).filter(Boolean);
const canonical = topics => [...new Set(parseTopics(topics).map(t => knownTopics.find(k => k.toLowerCase() === t.toLowerCase()) || t))];

function setPanel(open) { $("panel").hidden = !open; if (open) renderTopics(); }
$("topics-btn").onclick = () => setPanel($("panel").hidden);
$("panel-close").onclick = () => { renderTopics(); setPanel(false); };

/* ---------- Date ---------- */
function renderDate() { $("date-label").textContent = /^\d{4}-\d{2}-\d{2}$/.test($("date").value) ? shortDay($("date").value) : "Choose a date"; }
$("date").addEventListener("input", renderDate);
$("date").addEventListener("change", renderDate);

/* ---------- Champ de texte qui grandit ---------- */
function grow() { const t = $("text"); t.style.height = "40px"; t.style.height = Math.max(40, Math.min(t.scrollHeight, innerHeight * 0.4)) + "px"; }
$("text").addEventListener("input", grow);
// Cmd/Ctrl + Entrée : publier (Entrée seule = nouvelle ligne)
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("publish").click(); } });

/* ---------- Brouillon (nouvelle note seulement) ---------- */
function saveDraft() { if (!editing) store.set(KEY_DRAFT, JSON.stringify({ date: $("date").value, topics: $("topics").value, text: $("text").value })); }
function loadDraft() {
  let d = {}; try { d = JSON.parse(store.get(KEY_DRAFT)) || {}; } catch {}
  $("date").value = d.date || today(); $("topics").value = d.topics || ""; $("text").value = d.text || "";
  renderDate(); renderPills(); grow();
}
["date", "topics", "text"].forEach(id => $(id).addEventListener("input", saveDraft));

/* ---------- Modifier / supprimer ---------- */
let editing = null;   // { raw, date }
const ICON_SEND = '<path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/>';
const ICON_OK = '<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>';
function startEdit(n) {
  saveDraft();                                  // garde le brouillon de nouvelle note de côté
  editing = { raw: n.raw, date: n.date };
  confirmDelete = null; openMenu = null;
  $("date").value = n.date; $("topics").value = n.tags.join(", "); $("text").value = n.text;
  pending = []; renderFiles(); renderDate(); renderTopics();
  $("editing").hidden = false; $("editing-label").textContent = "✎ Editing the note from " + dayLabel(n.date);
  $("send-icon").innerHTML = ICON_OK; $("publish").setAttribute("aria-label", "Save changes"); $("publish").title = "Save changes";
  $("clear").hidden = true;
  setStatus(""); renderList(); grow();
  $("text").focus();
}
function stopEdit() {
  editing = null; askSave(false);
  $("editing").hidden = true; $("clear").hidden = false;
  $("send-icon").innerHTML = ICON_SEND; $("publish").setAttribute("aria-label", "Publish"); $("publish").title = "Publish";
  pending = []; renderFiles(); loadDraft(); renderList(); renderTopics();
}
$("cancel-edit").onclick = () => { stopEdit(); setStatus(""); };

async function removeNote(n) {
  confirmDelete = null; openMenu = null; renderList();
  setStatus("Deleting…");
  try {
    await commit(cur => {
      const s = splitNotes(cur);
      const i = s.blocks.findIndex(b => b.trimEnd() === n.raw.trimEnd());
      if (i < 0) throw Object.assign(new Error("missing"), { code: "missing" });
      s.blocks.splice(i, 1);
      return joinNotes(s);
    }, [], `Delete note ${n.date}`);
    if (editing && editing.raw === n.raw) stopEdit();
    setStatus("Deleted. The site updates in 1–2 minutes.");
  } catch (e) { setStatus(explain(e), true); }
}

/* ---------- Images ---------- */
let pending = [];   // { path, blob, name, url }
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\.[^.]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "image";

async function prepare(file) {
  // GIF : gardé tel quel (animation). Petites images : gardées telles quelles.
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [, "jpg"])[1].toLowerCase();
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    if (ext === "gif" || (img.naturalWidth <= 1600 && file.size < 500 * 1024)) return { blob: file, ext: ext === "jpeg" ? "jpg" : ext };
    const scale = Math.min(1, 1600 / img.naturalWidth);
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);   // fond blanc pour les PNG transparents
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    return { blob, ext: "jpg" };
  } finally { URL.revokeObjectURL(url); }
}

$("images").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  for (const f of files) {
    setStatus("Preparing " + f.name + "…");
    try {
      const { blob, ext } = await prepare(f);
      const path = `images/${$("date").value || today()}-${slug(f.name)}-${Math.random().toString(36).slice(2, 6)}.${ext}`;
      const url = URL.createObjectURL(blob);
      pending.push({ path, blob, name: f.name, url });
      localImages.set(path, url);
      insertAtCursor(`![${f.name.replace(/\.[^.]+$/, "").replace(/[\[\]]/g, "")}](${path})`);
      setStatus("");
    } catch {
      setStatus(f.name + " can't be read by this browser. If it is a HEIC photo, export it as JPG first.", true);
    }
  }
  renderFiles();
};
function insertAtCursor(line) {
  const ta = $("text"), s = ta.selectionStart ?? ta.value.length, v = ta.value;
  const before = v.slice(0, s), after = v.slice(s);
  const ins = (before && !before.endsWith("\n") ? "\n\n" : "") + line + (after.startsWith("\n") ? "" : "\n");
  ta.value = before + ins + after;
  ta.selectionStart = ta.selectionEnd = (before + ins).length;
  saveDraft(); grow();
}
// Miniatures des images ajoutées ; × retire l'image et sa ligne dans le texte
function renderFiles() {
  const box = $("files"); box.replaceChildren(); box.hidden = !pending.length;
  pending.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "thumb"; d.title = p.name;
    const img = document.createElement("img"); img.src = p.url; img.alt = p.name;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove " + p.name);
    x.onclick = () => {
      pending.splice(i, 1);
      const esc = p.path.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      $("text").value = $("text").value.replace(new RegExp("\\n?!\\[[^\\]]*\\]\\(" + esc + "\\)\\n?"), "\n").replace(/^\n+/, "");
      saveDraft(); grow(); renderFiles();
    };
    d.append(img, x); box.appendChild(d);
  });
}

/* ---------- Publier (nouvelle note) ou enregistrer (note modifiée) ---------- */
function checkForm() {
  if (!/^\d{4}-\d{2}-\d{2}$/.test($("date").value)) { setStatus("Choose a date.", true); return false; }
  if (!$("text").value.trim()) { setStatus("Write something before publishing.", true); return false; }
  return true;
}
// Note modifiée : on demande confirmation avant d'enregistrer
function askSave(open) { $("confirm-save").hidden = !open; $("publish").disabled = open; }
$("publish").onclick = () => {
  if (!checkForm()) return;
  if (editing) { setStatus(""); askSave(true); return; }
  publish();
};
$("confirm-yes").onclick = () => { askSave(false); publish(); };
$("confirm-no").onclick = () => askSave(false);

async function publish() {
  if (!checkForm()) return;
  const date = $("date").value, text = $("text").value.trim();
  const block = makeBlock(date, canonical($("topics").value), text);
  const newTopics = newTopicList().map(t => ({ tag: t, cat: newCats[t.toLowerCase()] || "Other" }));
  const images = pending.filter(p => text.includes(p.path));
  const firstLine = text.split("\n")[0].replace(/[#*\[\]()!<>]/g, "").slice(0, 60);

  $("publish").disabled = true;
  setStatus(editing ? "Saving…" : "Sending…");
  try {
    if (editing) {
      const orig = editing.raw;
      await commit(cur => {
        const s = splitNotes(cur);
        const i = s.blocks.findIndex(b => b.trimEnd() === orig.trimEnd());
        if (i < 0) throw Object.assign(new Error("missing"), { code: "missing" });
        s.blocks[i] = block;
        return joinNotes(s);
      }, images, `Edit note ${date}: ${firstLine}`, newTopics);
      stopEdit();
      setStatus("Saved. The site updates in 1–2 minutes.");
    } else {
      await commit(cur => cur.replace(/\s+$/, "") + "\n\n" + block, images, `Note ${date}: ${firstLine}`, newTopics);
      pending = []; renderFiles();
      $("text").value = ""; $("topics").value = ""; $("date").value = today(); store.del(KEY_DRAFT); newCats = {};
      renderDate(); renderTopics(); grow(); setPanel(false);
      setStatus("Published. The site updates in 1–2 minutes.");
      stick = true; requestAnimationFrame(scrollDown);
    }
  } catch (e) {
    setStatus(explain(e), true);
  }
  $("publish").disabled = false;
}

$("clear").onclick = () => {
  $("text").value = ""; $("topics").value = ""; $("date").value = today();
  pending = []; renderFiles(); store.del(KEY_DRAFT); setStatus(""); newCats = {};
  renderDate(); renderTopics(); grow();
};

loadDraft();
show();
</script>
